<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cat Video Pop-up</title>
<style>
  body { font-family: Arial, sans-serif; background: #f6f7fb; padding: 24px; }
  .thumb { width: 200px; height: auto; cursor: pointer; border-radius: 8px; box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
           background: rgba(0,0,0,0.75); z-index: 9999; }
  .card { width: min(800px, 90%); background: #111; border-radius: 8px; padding: 12px; }
  video { width: 100%; border-radius: 6px; background: #000; }
  .btn { margin-top: 10px; background: #ff6b6b; border: none; padding: 8px 12px;
         border-radius: 6px; color: white; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<h2>Click the cat thumbnail!</h2>
<img id="thumb" class="thumb" src="thumbnail.jpg" alt="Click me" />

<div id="modal" class="modal">
  <div class="card">
    <video id="prankVideo" controls playsinline></video>
    <button id="closeBtn" class="btn">Close</button>
  </div>
</div>

<script>
const thumb = document.getElementById('thumb');
const modal = document.getElementById('modal');
const video = document.getElementById('prankVideo');
const closeBtn = document.getElementById('closeBtn');

// point video source to your MP4 file
video.src = "cat.mp4";

thumb.addEventListener('click', () => {
  modal.style.display = "flex";
  video.currentTime = 0;
  video.play().catch(err => console.warn("Autoplay blocked:", err));
});

closeBtn.addEventListener('click', () => {
  modal.style.display = "none";
  video.pause();
});
modal.addEventListener('click', (e) => {
  if (e.target === modal) {
    modal.style.display = "none";
    video.pause();
  }
});
</script>

</body>
</html>
